name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Add cmake wrapper (OpenSSL libs fix)
        run: |
          REAL_CMAKE=$(command -v cmake)
          mkdir -p "$RUNNER_TEMP/cmakewrap"
          cat > "$RUNNER_TEMP/cmakewrap/cmake" <<EOF
          #!/bin/bash
          REAL="$REAL_CMAKE"
          EOF
          cat >> "$RUNNER_TEMP/cmakewrap/cmake" <<'EOF'
          case "$1" in --build|--install|-E|--version|--help) exec "$REAL" "$@";; esac
          EXTRA=()
          if [ -n "$OPENSSL_ROOT_DIR" ]; then
            CRYPTO=$(find "$OPENSSL_ROOT_DIR" \( -name libcrypto.a -o -name libcrypto.so \) | sort | head -1)
            SSL=$(find "$OPENSSL_ROOT_DIR" \( -name libssl.a -o -name libssl.so \) | sort | head -1)
            echo "cmake-wrapper: root=$OPENSSL_ROOT_DIR crypto=${CRYPTO:-none} ssl=${SSL:-none}" >&2
            if [ -n "$CRYPTO" ]; then
              EXTRA+=(-DOPENSSL_CRYPTO_LIBRARY="$CRYPTO" -DOPENSSL_SSL_LIBRARY="$SSL" -DOPENSSL_INCLUDE_DIR="${OPENSSL_INCLUDE_DIR:-$OPENSSL_ROOT_DIR/include}" -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH)
            fi
          fi
          exec "$REAL" "${EXTRA[@]}" "$@"
          EOF
          chmod +x "$RUNNER_TEMP/cmakewrap/cmake"
          echo "$RUNNER_TEMP/cmakewrap" >> "$GITHUB_PATH"

      - name: Build Release APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PversionName=${{ github.event.inputs.tag_name }} -Pandroid.injected.build.abi=armeabi-v7a

      - name: Debug OpenSSL libs
        if: failure()
        run: |
          find "$GITHUB_WORKSPACE" -name "libcrypto*" 2>/dev/null | head -20
          ls -la app/src/main/rust/slipstream-rust/scripts 2>/dev/null || true

      - name: Align and sign 32-bit APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ github.event.inputs.tag_name }}
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          cd app/build/outputs/apk/release
          ls -la
          APK=$(ls *armeabi-v7a*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then APK=$(ls *.apk | head -1); fi
          echo "Using: $APK"
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "slipstream-$TAG-armeabi-v7a-release.apk" \
            aligned.apk
          "$BT/apksigner" verify --print-certs "slipstream-$TAG-armeabi-v7a-release.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: app/build/outputs/apk/release/slipstream-${{ github.event.inputs.tag_name }}-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
